
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OX 퀴즈</title>

    <style>
        /* 전체 페이지 */
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        /* 퀴즈 영역 */
        .quiz {
            max-width: 700px;
            margin: 0 auto 30px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            padding: 20px;
        }

        /* 문제 번호 */
        .question-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 문제 본문 */
        .question {
            min-height: 80px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* OX 버튼 배치 */
        .button-group {
            display: flex;
            gap: 15px;
        }

        /* 버튼 공통 CSS */
        button {
            flex: 1;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* O 버튼 */
        .button-o {
            background-color: #3498db;
        }

        /* X 버튼 */
        .button-x {
            background-color: #e74c3c;
        }

        /* 마우스를 올렸을 때 */
        button:hover {
            opacity: 0.8;
        }

        /* 버튼을 눌렀을 때 */
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <!-- 첫 번째 문제 -->
    <div class="quiz">
        <div class="question-number">문제 1</div>

        <div class="question">
            html과 htm은 기초 구조가 서로 다른 목적으로 설계된 확장자입니다.
        </div>

        <div class="button-group">
            <button type="button" class="button-o"
                onclick="alert('오답입니다!\n과거의 운영체제인 ms-dom, 그리고 초기의 윈도우 버전에서는 파일 확장자명의 길이를 3 글자까지만 허용했기 때문에 html에서 l을 뺀 htm을 사용했습니다. 시간이 지나 오늘날의 운영체제에서는 이전보다 더 긴 파일 확장자명을 지원하기 때문에, html을 기본 표준으로 사용하게 되었으며, htm은 과거의 잔재로 남아있습니다.')">
                O
            </button>

            <button type="button" class="button-x"
                onclick="alert('정답입니다!')">
                X
            </button>
        </div>
    </div>

    <!-- 두 번째 문제 -->
    <div class="quiz">
        <div class="question-number">문제 2</div>

        <div class="question">
            http는 https의 보안 취약점을 보완하기 위해 설계된 차세대 통신 규약입니다.
        </div>

        <div class="button-group">
            <button type="button" class="button-o"
                onclick="alert('오답입니다!\nHypertext Transfer Protocol Secure는 웹 브라우저와 웹사이트가 데이터를 안전하게 주고받기 위해 사용하는 보안된 하이퍼텍스트 전송 규약입니다.\n\n기존의 http는 암호화 과정이 없기 때문에 중간 과정에서 정보가 유출되는 등의 보안에 취약하다는 단점을 가지고 있기 때문에, https에서는 SSL 인증서를 통해 문서를 암호화 하여 중간 과정에서 유출되더라도 내용을 파악할 수 없게 보완한 형태입니다.')">
                O
            </button>

            <button type="button" class="button-x"
                onclick="alert('정답입니다!')">
                X
            </button>
        </div>
    </div>

</body>
</html>
